name: CI
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release-**"
      - "track/**"
    paths-ignore:
      - "terraform/**"
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - "terraform/**"

jobs:
  tests:
    name: CI
    uses: canonical/identity-team/.github/workflows/charm-pull-request.yaml@1bf335af1d939c8543e53d376dd49d79126c2cd3 # v1.15.0
    with:
      base: "24.04"
      k8s-channel: "1.35-strict/stable"
      container-name: "identity-saml-provider"
      use-charmcraftcache: false
      node-size: large
      pytest-model-option: '--juju-model'
      juju-model-name: 'testing'
